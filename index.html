<!DOCTYPE html>
<html>
<head>
  <title>BugBooth</title>
  <style>
    body {
      margin: 0;
      background: #020617;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .container {
      display: none;
    }

    .container.active {
      display: block;
    }

    iframe {
      width: 100%;
      height: 90vh;
      border: none;
    }

    .nav {
      margin: 10px;
    }

    button {
      padding: 10px 20px;
      margin: 5px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      background: #f97316;
      color: white;
    }

    button:disabled {
      background: #475569;
      cursor: not-allowed;
    }
  </style>
</head>

<body>

<!-- BUG CODE 1 -->
<div class="container active" id="code1">
  <iframe src="https://onecompiler.com/embed/python?code=bnVtcyA9IFsxLCAyLCAzLCA0LCA1XQoKZm9yIG4gaW4gbnVtczoKICAgIGlmIG4gJSAyID09IDA6CiAgICAgICAgbnVtcy5yZW1vdmUobikKCnByaW50KG51bXMp"></iframe>
</div>

<!-- BUG CODE 2 -->
<div class="container" id="code2">
  <iframe src="https://onecompiler.com/embed/python?code=c3R1ZGVudCA9IHsKICAgICJuYW1lIjogIkRoZWVyYWoiLAogICAgImFnZSI6IDIxCn0KCnByaW50KHN0dWRlbnRbIm1hcmtzIl0p"></iframe>
</div>

<!-- BUG CODE 3 -->
<div class="container" id="code3">
  <iframe src="https://onecompiler.com/embed/python?code=ZGVmIGF2ZXJhZ2UobnVtYmVycyk6CiAgICB0b3RhbCA9IDAKICAgIGZvciBuIGluIG51bWJlcnM6CiAgICAgICAgdG90YWwgKz0gbgogICAgICAgIHJldHVybiB0b3RhbCAvIGxlbihudW1iZXJzKQoKcHJpbnQoYXZlcmFnZShbMTAsIDIwLCAzMCwgNDBdKSk="></iframe>
</div>

<div class="nav">
  <button onclick="prev()" id="prevBtn" disabled>⬅ Previous</button>
  <button onclick="next()" id="nextBtn">Next ➡</button>
</div>

<script>
  let current = 1;
  const total = 3;

  function show(step) {
    for (let i = 1; i <= total; i++) {
      document.getElementById("code" + i).classList.remove("active");
    }
    document.getElementById("code" + step).classList.add("active");

    document.getElementById("prevBtn").disabled = step === 1;
    document.getElementById("nextBtn").disabled = step === total;
  }

  function next() {
    if (current < total) {
      current++;
      show(current);
    }
  }

  function prev() {
    if (current > 1) {
      current--;
      show(current);
    }
  }
</script>

</body>
</html>
