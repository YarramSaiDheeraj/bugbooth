<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BugBooth</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #020617;
            color: #ffffff;
            text-align: center;
        }
        header {
            background-color: #0f172a;
            padding: 15px;
            font-size: 26px;
            font-weight: bold;
        }
        .rules {
            background-color: #1e293b;
            margin: 15px;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
        }
        iframe {
            width: 96%;
            height: 520px;
            border: none;
            margin-bottom: 15px;
        }
        footer {
            padding: 10px;
            font-size: 14px;
            color: #cbd5f5;
        }
    </style>
</head>

<body>

<header>🐞 BUGBOOTH – Debug the Code 🐞</header>

<div class="rules">
    ⏱ Time: 15–20 Minutes &nbsp; | &nbsp;
    ❌ No Internet Search &nbsp; | &nbsp;
    ❌ No Mobile Phones &nbsp; | &nbsp;
    ✅ Debug Only
</div>

<h3>Fix the bugs and run the program</h3>

<!-- Online Compiler -->
<iframe src="https://www.jdoodle.com/embed/v0/5u9x"></iframe>

<footer>
    Show successful output to the coordinator
</footer>

</body>
</html>
